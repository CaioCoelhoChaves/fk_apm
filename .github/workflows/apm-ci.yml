name: APM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Audit & Validate APM Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup APM and Audit
        uses: microsoft/apm-action@v1
        with:
          script: audit --ci

      - name: Verify Marketplace Integrity
        run: |
          apm marketplace check --offline
          apm pack --dry-run
